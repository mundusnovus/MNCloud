<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect an app · Christian Cloud</title>
<link rel="icon" type="image/svg+xml" href="/brand/cloud-icon.svg">
<link rel="stylesheet" href="/brand/tokens.css">
<link rel="stylesheet" href="/app.css">
<script src="/allow.js" defer></script>
</head>
<body>
<main style="min-height:100dvh;display:grid;place-items:center;padding:24px">
  <div style="max-width:440px;text-align:center;display:grid;gap:14px;justify-items:center">
    <img src="/brand/cloud-mark.svg" width="80" height="80" alt="" style="image-rendering:pixelated">
    <h1 class="display" style="margin:0">Connect to your Cloud?</h1>
    <p class="note" id="who">An app is asking to reach your files.</p>
    <p class="note">It gets its own key. You can disconnect it any time in Devices and apps.</p>
    <form method="post" id="form" style="display:flex;gap:10px;justify-content:center"><input type="hidden" name="csrf" id="csrf">
      <button class="btn" name="answer" value="deny" type="submit">Not now</button><button class="btn primary" name="answer" value="allow" type="submit">Connect</button></form>
  </div>
</main>
</body>
</html>
