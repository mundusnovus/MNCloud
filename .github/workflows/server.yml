name: Cloud server checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          find apps server -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check apps/christiancloud/js/cloud.js
          docker build -t christian-cloud:test .
