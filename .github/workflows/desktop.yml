# Christian Cloud for the desktop: Nextcloud's desktop client (pinned in upstream.lock.json), branded by
# desktop/apply-branding.sh and built with Nextcloud's own tools: mac-crafter on macOS, the AppImage container on
# Linux. A tag desktop-v* publishes a GitHub release. Nextcloud desktop: GPL-2.0-or-later.
name: Desktop
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
env:
  UPSTREAM_REF: v35.0.1
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { path: cs }
      - uses: actions/checkout@v4
        with: { repository: nextcloud/desktop, ref: '${{ env.UPSTREAM_REF }}', path: desktop }
      - run: sh cs/desktop/apply-branding.sh desktop
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install inkscape create-dmg || true
      - name: Build with mac-crafter
        working-directory: desktop/admin/osx/mac-crafter
        shell: bash
        run: |
          set -o pipefail
          swift run mac-crafter build \
            --build-path "$RUNNER_TEMP/build" --product-path "$RUNNER_TEMP/product" --arch arm64 \
            --build-type Release --app-name "Christian Cloud" \
            --override-server-url https://cloud.christiansystems.org --force-override-server-url \
            --disable-auto-updater "$GITHUB_WORKSPACE/desktop" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Show why the build failed
        if: failure()
        shell: bash
        run: python3 -c "import sys,urllib.parse as u;L=open(sys.argv[1],errors='replace').read().splitlines();E=[l for i,l in enumerate(L) if 'error' in l.lower() and len(l)<400][:25];t=chr(10).join(E or L[-40:]);print('::error title=mac-crafter::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$RUNNER_TEMP/build.log"
      - name: Sign for this machine's Gatekeeper and make the disk image
        run: |
          APP=$(find "$RUNNER_TEMP/product" -maxdepth 2 -name '*.app' | head -1)
          test -n "$APP"
          # Without an Apple Developer ID, an ad-hoc signature over the whole bundle keeps macOS from calling it damaged.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Christian Cloud" -srcfolder dmg -ov -format UDZO "Christian-Cloud-macOS-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: christian-cloud-macos, path: Christian-Cloud-macOS-arm64.dmg }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: ghcr.io/nextcloud/continuous-integration-client-appimage-qt6:client-appimage-el9-6.11.2-4
    steps:
      - uses: actions/checkout@v4
        with: { path: cs }
      - uses: actions/checkout@v4
        with: { repository: nextcloud/desktop, ref: '${{ env.UPSTREAM_REF }}', path: desktop }
      - run: sh cs/desktop/apply-branding.sh desktop
      - name: Build the AppImage
        id: build
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          BUILDNR=${GITHUB_RUN_ID} BUILD_UPDATER=OFF DESKTOP_CLIENT_ROOT=$(pwd) EXECUTABLE_NAME=christiancloud QT_BASE_DIR=/root/linux-gcc-x86_64 /bin/bash -c "./admin/linux/build-appimage.sh" 2>&1 | tee /tmp/build.log
      - name: Show why the build failed
        if: failure()
        shell: bash
        run: python3 -c "import sys;L=open(sys.argv[1],errors='replace').read().splitlines();E=[l for i,l in enumerate(L) if 'error' in l.lower() and len(l)<400][:25];t=chr(10).join(E or L[-40:]);print('::error title=appimage::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))" /tmp/build.log
      - uses: actions/upload-artifact@v4
        with: { name: christian-cloud-linux, path: 'desktop/**/*.AppImage' }
  publish:
    needs: [macos, linux]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { name: 'Christian Cloud Desktop ${{ github.ref_name }}', files: 'dist/**', fail_on_unmatched_files: false }
