# Christian Cloud's site. Replaces the image's 000-default.conf so our rewrite rules run in the same virtual host as
# Nextcloud's (rules at server level are not inherited by a virtual host).
<VirtualHost *:80>
  DocumentRoot /var/www/html
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
  RewriteEngine On
  # Route only the root to our app. DAV, OCS, Login Flow and admin routes remain upstream.
  RewriteRule ^/$ /index.php/apps/christiancloud/ [PT,L]
  # Answer the browser's cross-site check for the other Christian Systems apps directly.
  RewriteCond %{REQUEST_METHOD} =OPTIONS
  RewriteCond %{HTTP:Origin} ^https://(sprite|box|office)\.christiansystems\.org$
  RewriteRule ^/(remote\.php/dav/|(index\.php/)?login/v2) - [R=204,L]
</VirtualHost>
