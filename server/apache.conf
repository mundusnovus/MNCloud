# Cross-site headers for the other Christian Systems apps (Sprite, Box, Office). The rewrite rules live in the site
# (vhost.conf). App passwords are required for cross-app DAV; credentialed cookie requests are never allowed.
# Everything is decided from the request the browser sent: Nextcloud rewrites /login/v2/poll to /index.php inside
# Apache, which changes the path and renames environment variables, so neither can be relied on.
<If "%{HTTP:Origin} =~ m#^https://(sprite|box|office)\.christiansystems\.org$# && %{THE_REQUEST} =~ m#^[A-Z]+ /(remote\.php/dav/|(index\.php/)?login/v2)#">
 Header always set Access-Control-Allow-Origin "expr=%{req:Origin}"
 Header always merge Vary "Origin"
 Header always set Access-Control-Allow-Methods "GET, PUT, DELETE, MKCOL, MOVE, PROPFIND, POST, OPTIONS"
 Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Depth, Destination, Overwrite, If-Match, If-None-Match, X-Requested-With"
 Header always set Access-Control-Expose-Headers "ETag, OC-FileId"
</If>
