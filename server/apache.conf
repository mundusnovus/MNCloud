# Route only the root to our app. DAV, OCS, Login Flow and admin routes remain upstream.
RewriteEngine On
RewriteRule ^/$ /index.php/apps/christiancloud/ [PT,L]
# App passwords are required for cross-app DAV. Never allow credentialed cookie CORS.
SetEnvIf Origin "^https://(sprite|box|office)\.christiansystems\.org$" CS_ORIGIN=$0
<LocationMatch "^/(remote\.php/dav/|index\.php/login/v2)">
 Header always set Access-Control-Allow-Origin "%{CS_ORIGIN}e" env=CS_ORIGIN
 Header always merge Vary "Origin"
 Header always set Access-Control-Allow-Methods "GET, PUT, DELETE, MKCOL, MOVE, PROPFIND, POST, OPTIONS" env=CS_ORIGIN
 Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Depth, Destination, Overwrite, If-Match, If-None-Match, X-Requested-With" env=CS_ORIGIN
 Header always set Access-Control-Expose-Headers "ETag, OC-FileId" env=CS_ORIGIN
</LocationMatch>
RewriteCond %{REQUEST_METHOD} =OPTIONS
RewriteCond %{HTTP:Origin} ^https://(sprite|box|office)\.christiansystems\.org$
RewriteRule ^/(remote\.php/dav/|index\.php/login/v2) - [R=204,L]
